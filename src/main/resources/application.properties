# Configuración del Data Source Reactivo para PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=ID2024

# Formato de la URL Reactiva: postgresql://[HOST]:[PUERTO]/[NOMBRE_BASE_DE_DATOS]
quarkus.datasource.reactive.url=postgresql://localhost:5432/postgres

# Configuración de Hibernate Reactive (Estrategia de generación de tablas)
# 'update' creará las tablas automáticamente si no existen al iniciar la app
quarkus.hibernate-orm.database.generation=update

# Muestra en la consola las consultas SQL reales que se están ejecutando (muy útil para desarrollo)
quarkus.hibernate-orm.log.sql=true
